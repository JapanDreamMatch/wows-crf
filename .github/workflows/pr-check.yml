name: PR Safety & Quality Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1. 高速静的検査・セキュリティ不変条件・単体テスト（約25〜35秒）
  quality-and-security:
    name: Security, Typecheck, Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Public repo security & invariant check
        run: npm run security:check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint static analysis
        run: npm run lint

      - name: Vitest unit & regression tests
        run: npm test

  # 2. 新規追加パッケージの脆弱性・ライセンス検査（PR時のみ・並列実行で約5〜10秒）
  dependency-review:
    name: Dependency Vulnerability Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # 3. Next.js 本番ビルド・App Router 整合性検証（.next/cache 利用・並列実行で約20〜45秒）
  build-check:
    name: Next.js Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
