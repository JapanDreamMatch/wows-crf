steps:
  # Build
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: [
      '-c',
      'docker',
      'build',
      '--build-arg',
      'NEXT_PUBLIC_TEST_SECRET=$$NEXT_PUBLIC_TEST_SECRET',
      '-t',
      'us-central1-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${COMMIT_SHA}',
      '.'
    ]

  # Push
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'us-central1-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${COMMIT_SHA}'
    ]

  # Deploy
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: [
      '-c',
      'docker',
      'run',
      '--env',
      'NEXT_PUBLIC_TEST_SECRET=$$NEXT_PUBLIC_TEST_SECRET'
    ]

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/wows-crf_TEST_SECRET/latest
      env: TEST_SECRET