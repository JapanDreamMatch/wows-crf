steps:
  # コンテナイメージのビルドを実行
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: 'bash'
    args:
      [
        "build",
        "-t",
        "us-central1-docker.pkg.dev/${PROJECT_ID}/wows-crf/$COMMIT_SHA",
        "."
      ]
    env:
      - 'NEXT_PUBLIC_TEST_SECRET=$TEST_SECRET'
    secretEnv: ['NEXT_PUBLIC_TEST_SECRET']
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/wows-crf_TEST_SECRET/versions/latest
      env: 'NEXT_PUBLIC_TEST_SECRET'
options:
  logging: CLOUD_LOGGING_ONLY